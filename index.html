<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Agente Viajero</title>
    <style>
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 900px;
            background-color: #202024;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            gap: 20px;
        }
        .panel-left, .panel-right {
            flex: 1;
            background-color: #1a1a1e;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #29292e;
        }
        h2 { color: #996dff; margin-top: 0; }
        .btn-primary {
            background: linear-gradient(90deg, #a855f7, #6366f1);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
        }
        .btn-primary:hover { opacity: 0.9; }
        .input-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .input-group button {
            background-color: #29292e;
            color: white;
            border: 1px solid #3e3e42;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .input-group span { font-size: 24px; font-weight: bold; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab {
            padding: 8px 16px;
            background-color: #29292e;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .tab.active { background-color: #996dff; color: white; }
        #canvas-grafo {
            background-color: #121214;
            border-radius: 8px;
            width: 100%;
            height: 300px;
        }
        #output {
            margin-top: 15px;
            font-family: monospace;
            background-color: #121214;
            padding: 10px;
            border-radius: 6px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Panel Izquierdo: Visualización -->
    <div class="panel-left">
        <div class="tabs">
            <div class="tab active">🟣 Grafo</div>
            <div class="tab">🔢 Matriz</div>
        </div>
        <canvas id="canvas-grafo"></canvas>
        <div id="output">Resultados de Fuerza Bruta...</div>
    </div>

    <!-- Panel Derecho: Configuración -->
    <div class="panel-right">
        <h2>¿Cuántas ciudades?</h2>
        <p style="color: #8d8d99; font-size: 14px;">Entre 5 y 10 nodos para el problema del viajero.</p>
        
        <div class="input-group">
            <button onclick="cambiarNodos(-1)">-</button>
            <span id="lbl-nodos">5</span>
            <button onclick="cambiarNodos(1)">+</button>
        </div>

        <button class="btn-primary" onclick="generarMapa()">Crear mapa ➔</button>
    </div>
</div>

<script>
    let numNodos = 5;
    const canvas = document.getElementById('canvas-grafo');
    const ctx = canvas.getContext('2d');

    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;

    function cambiarNodos(valor) {
        numNodos += valor;
        if (numNodos < 5) numNodos = 5;
        if (numNodos > 10) numNodos = 10;
        document.getElementById('lbl-nodos').innerText = numNodos;
    }

    function generarMapa() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const nodos = [];
        const centroX = canvas.width / 2;
        const centroY = canvas.height / 2;
        const radio = 90;

        // 1. Calcular posiciones circulares de los nodos
        for (let i = 0; i < numNodos; i++) {
            const angulo = (i * 2 * Math.PI) / numNodos;
            const x = centroX + radio * Math.cos(angulo);
            const y = centroY + radio * Math.sin(angulo);
            nodos.push({ label: String.fromCharCode(65 + i), x, y });
        }

        // 2. Dibujar aristas de forma aleatoria (Ciclo Hamiltoniano base)
        ctx.strokeStyle = '#29292e';
        ctx.lineWidth = 2;
        for (let i = 0; i < numNodos; i++) {
            const sig = (i + 1) % numNodos;
            ctx.beginPath();
            ctx.moveTo(nodos[i].x, nodos[i].y);
            ctx.lineTo(nodos[sig].x, nodos[sig].y);
            ctx.stroke();
            
            // Dibujar peso estimado en medio de la línea
            ctx.fillStyle = '#8d8d99';
            ctx.font = '12px sans-serif';
            ctx.fillText(Math.floor(Math.random() * 90 + 10), (nodos[i].x + nodos[sig].x)/2, (nodos[i].y + nodos[sig].y)/2);
        }

        // 3. Dibujar los nodos visuales
        nodos.forEach(n => {
            ctx.beginPath();
            ctx.arc(n.x, n.y, 16, 0, 2 * Math.PI);
            ctx.fillStyle = '#996dff';
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(n.label, n.x, n.y);
        });

        // 4. Mostrar métricas de fuerza bruta aplicando (n-1)!
        let r_ev = 1;
        for(let i = 1; i < numNodos; i++) r_ev *= i; // Cálculo matemático de (n-1)!
        
        document.getElementById('output').innerHTML = 
            `Rutas analizadas por Fuerza Bruta [(n-1)!]: <b>${r_ev}</b><br>` +
            `Ciclos Hamiltonianos únicos: <b>${r_ev / 2}</b><br><br>` +
            `<span style="color: #4cd62b;">✔ Interfaz gráfica cargada exitosamente.</span>`;
    }

    // Inicializar primer mapa al cargar
    generarMapa();
</script>

</body>
</html>
